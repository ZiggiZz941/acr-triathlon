name: triathlon_app
description: "Application d'entraînement Triathlon"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.0
  intl: ^0.19.0
  flutter_launcher_icons: ^0.14.4
  
  cupertino_icons: ^1.0.2
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/triathlon_logo.png
    - assets/images/cycling_icon.png
    - assets/images/running_icon.png
    - assets/images/swimming_icon.png
  

flutter_icons:
  android: true
  ios: true
  image_path: assets/images/triathlon_logo.png