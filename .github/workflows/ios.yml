name: Build iOS IPA

on:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'  # Version stable

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Setup iOS
        run: |
          cd ios
          pod install --repo-update

      - name: Build IPA
        run: |
          flutter build ipa --release --no-codesign

      - name: Upload IPA
        uses: actions/upload-artifact@v3
        with:
          name: triathlon-app-ipa
          path: build/ios/ipa/*.ipa