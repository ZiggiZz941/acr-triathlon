workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    environment:
      groups:
        - appstore_credentials  # À créer sur Codemagic plus tard
      vars:
        XCODE_PROJECT: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.triathlon.app"  # MODIFIEZ avec un identifiant unique
      flutter: "3.16.0"  # Version spécifique
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Setup iOS
        script: |
          cd ios
          pod install --repo-update
      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - thomaschollet941@gmail.com  # CORRIGÉ: un seul .com