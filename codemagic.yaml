workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    environment:
      groups:
        - appstore_credentials  # Vous créerez ce groupe après
      vars:
        XCODE_PROJECT: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.votre.nom.triathlonapp"  # À MODIFIER
      flutter: stable
      xcode: latest  # Codemagic utilisera Xcode 15+
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter packages pub get
          cd ios && pod install
      - name: Build iOS
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - thomaschollet941@gmail.com.com